[project]
name = "gatp"
version = "0.1.0"
description = "GATP: human-in-the-loop web testing assistant (course project)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "playwright>=1.48",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.27",
]

[project.scripts]
gatp-api = "gatp.api.main:main"
gatp-runner = "gatp.runner.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "poethepoet>=0.31",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/gatp"]

# ---------------------------------------------------------------- tasks (ADR-012)
# Run any task with:  uv run poe <task>     (Linux / WSL2, ADR-014)

[tool.poe.tasks.api]
help = "Start the FastAPI app on http://127.0.0.1:8000 (auto-reload)"
cmd = "gatp-api --reload"

[tool.poe.tasks.runner]
help = "Start the runner process (stub until T-006)"
cmd = "gatp-runner"

[tool.poe.tasks.web-install]
help = "Install frontend dependencies (npm ci)"
cmd = "npm --prefix frontend ci"

[tool.poe.tasks.web]
help = "Start the Vite dev server on http://localhost:5173 (proxies /api to :8000)"
cmd = "npm --prefix frontend run dev"

[tool.poe.tasks.browsers]
help = "Download Chromium for Playwright plus its system libraries (asks for sudo)"
cmd = "playwright install --with-deps chromium"

[tool.poe.tasks.fixtures]
help = "Serve the BookShelf fixture site: uv run poe fixtures v1|v2 (http://127.0.0.1:8090)"
cmd = "python fixtures/serve.py ${version}"
args = [{ name = "version", positional = true, default = "v1", help = "v1 or v2" }]

[tool.poe.tasks.db-upgrade]
help = "Create or upgrade the SQLite schema (data/gatp.sqlite) to the latest migration"
cmd = "python -m gatp.store.migrate upgrade"

[tool.poe.tasks.db-revision]
help = "Autogenerate a new Alembic migration from models.py: uv run poe db-revision \"message\""
cmd = "python -m gatp.store.migrate revision ${message}"
args = [{ name = "message", positional = true, help = "short description" }]

[tool.poe.tasks.llm-check]
help = "Check model config: list Gemini models for your key and make one tiny logged call"
cmd = "python -m gatp.llm_gateway.check"

[tool.poe.tasks.gen-client]
help = "Export the OpenAPI schema and regenerate the TypeScript client types"
sequence = [
    { cmd = "python -m gatp.api.export_openapi frontend/openapi.json" },
    { cmd = "npm --prefix frontend run gen:api" },
]

[tool.poe.tasks.lint]
help = "Ruff lint + format check"
sequence = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]

[tool.poe.tasks.fmt]
help = "Auto-fix lint issues and format Python code"
sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }]

[tool.poe.tasks.types]
help = "mypy --strict on the backend"
cmd = "mypy"

[tool.poe.tasks.test]
help = "Run backend tests"
cmd = "pytest"

[tool.poe.tasks.check-backend]
help = "All backend checks (lint, types, tests)"
sequence = ["lint", "types", "test"]

[tool.poe.tasks.check-frontend]
help = "All frontend checks (eslint, prettier, tsc, build)"
cmd = "npm --prefix frontend run check"

[tool.poe.tasks.check]
help = "Everything CI runs"
sequence = ["check-backend", "check-frontend"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]
include = ["*.py", "*.pyi"]
extend-exclude = ["frontend", "fixtures/site-v1", "fixtures/site-v2"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
files = ["backend/src", "backend/tests", "fixtures/serve.py"]
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["importlinter.*", "grimp.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

# ---------------------------------------------------------------- import-linter
# Mirrors docs/modules/README.md "Dependency direction". Checked by backend/tests/test_architecture.py.
[tool.importlinter]
root_package = "gatp"

[[tool.importlinter.contracts]]
name = "Layered modules: upper layers may import lower, never the reverse"
type = "layers"
layers = [
    "gatp.api",
    "gatp.test_designer : gatp.codegen : gatp.maintainer : gatp.runner",
    "gatp.inspector : gatp.llm_gateway : gatp.store",
]

[[tool.importlinter.contracts]]
name = "Only the api dispatches runner jobs; feature modules never import the runner"
type = "forbidden"
source_modules = ["gatp.test_designer", "gatp.codegen", "gatp.maintainer"]
forbidden_modules = ["gatp.runner"]

[[tool.importlinter.contracts]]
name = "Runner and inspector never import LLM or store code (isolation, ADR-004)"
type = "forbidden"
source_modules = ["gatp.runner", "gatp.inspector"]
forbidden_modules = ["gatp.llm_gateway", "gatp.store"]

[[tool.importlinter.contracts]]
name = "store and llm-gateway never import the inspector"
type = "forbidden"
source_modules = ["gatp.store", "gatp.llm_gateway"]
forbidden_modules = ["gatp.inspector"]
