name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python + dependencies (locked)
        run: uv sync --locked
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium
      - name: Lint (ruff)
        run: uv run poe lint
      - name: Types (mypy --strict)
        run: uv run poe types
      - name: Tests (pytest, incl. import contracts)
        run: uv run poe test

  frontend:
    name: Frontend (eslint, prettier, tsc, build, client freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --locked
          npm --prefix frontend ci
      - name: Generated API client is up to date
        run: |
          uv run poe gen-client
          git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts \
            || (echo "::error::Generated client is stale. Run 'uv run poe gen-client' and commit." && exit 1)
      - name: Lint, format, typecheck, build
        run: uv run poe check-frontend
